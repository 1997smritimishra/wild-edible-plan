<div class="welcome-page">
  <div class="welcome-card">

    <!-- Brand -->
    <div class="brand">
      <span class="brand-icon">🌿</span>
      <h1 class="brand-title">Web GIS Plant Portal</h1>
      <p class="brand-sub">Wild Edible Plant Database & GIS System</p>
    </div>

    <!-- Step 1: Role selection -->
    <div class="section-label">Select your role</div>
    <div class="role-row">
      <label
        *ngFor="let r of roles"
        class="role-chip"
        [class.active]="selectedRole === r.id"
      >
        <input type="radio" name="role" [value]="r.id"
               [(ngModel)]="selectedRole" (change)="selectRole(r.id)" />
        <span class="chip-icon">{{ r.icon }}</span>
        <span class="chip-label">{{ r.label }}</span>
      </label>
    </div>

    <!-- Hint shown before any role is selected -->
    <div class="hint-msg" *ngIf="!formVisible">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/>
      </svg>
      Please select a role above to proceed with login
    </div>

    <!-- Step 2: Login form (visible only after role selected) -->
    <div class="login-form" *ngIf="formVisible">

      <div class="form-header">
        Logging in as <strong>{{ selectedRole }}</strong>
      </div>

      <!-- Error -->
      <div class="alert-error" *ngIf="errorMsg">❌ {{ errorMsg }}</div>

      <div class="field">
        <label class="field-label">Email ID <span class="req">*</span></label>
        <input class="field-input" type="email" [(ngModel)]="emailId"
               placeholder="e.g. admin@test.com" (keyup.enter)="login()" />
      </div>

      <div class="field">
        <label class="field-label">Password <span class="req">*</span></label>
        <input class="field-input" type="password" [(ngModel)]="password"
               placeholder="Enter your password" (keyup.enter)="login()" />
      </div>

      <button class="btn-login"
              [disabled]="!emailId.trim() || !password || loading"
              (click)="login()">
        <span *ngIf="!loading">Login →</span>
        <span *ngIf="loading">Verifying…</span>
      </button>

    </div>

  </div>
</div>
